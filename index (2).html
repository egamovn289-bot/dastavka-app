<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dastavka Bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --accent: #4f8ef7;
    --accent2: #f7934f;
    --green: #3dd68c;
    --text: #f0f2ff;
    --muted: #8891b0;
    --border: #2a2d3e;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
  }
  .header {
    text-align: center;
    padding: 24px 0 20px;
  }
  .logo {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    margin: 0 auto 12px;
    box-shadow: 0 8px 24px rgba(79,142,247,0.3);
  }
  h1 { font-size: 24px; font-weight: 900; }
  .subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .steps {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 20px 0;
  }
  .step-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: all .3s;
  }
  .step-dot.active { background: var(--accent); width: 24px; border-radius: 4px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    animation: slideUp .4s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 12px;
  }

  .field { margin-bottom: 14px; }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  input, textarea, select {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color .2s;
  }
  input:focus, textarea:focus {
    border-color: var(--accent);
  }
  textarea { resize: none; height: 80px; }

  .loc-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #1e2a45, #1a2235);
    border: 1.5px solid var(--accent);
    border-radius: 12px;
    color: var(--accent);
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all .2s;
  }
  .loc-btn:active { transform: scale(.98); }
  .loc-btn.success {
    border-color: var(--green);
    color: var(--green);
    background: linear-gradient(135deg, #1a2e25, #1a2520);
  }

  .map-preview {
    width: 100%;
    height: 160px;
    border-radius: 12px;
    background: linear-gradient(135deg, #1a2235, #1e2a45);
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
    margin-top: 12px;
    overflow: hidden;
    position: relative;
  }
  .map-preview iframe {
    width: 100%; height: 100%;
    border: none;
    border-radius: 12px;
  }
  .map-coords {
    font-size: 12px;
    color: var(--green);
    text-align: center;
    margin-top: 8px;
    font-weight: 700;
  }

  .submit-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent), #6fa8ff);
    border: none;
    border-radius: 14px;
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
    transition: all .2s;
    box-shadow: 0 8px 24px rgba(79,142,247,0.35);
    margin-top: 8px;
  }
  .submit-btn:active { transform: scale(.98); }
  .submit-btn:disabled {
    background: var(--border);
    color: var(--muted);
    box-shadow: none;
    cursor: not-allowed;
  }

  .success-screen {
    display: none;
    text-align: center;
    padding: 40px 20px;
    animation: slideUp .5s ease;
  }
  .success-icon {
    width: 90px; height: 90px;
    background: linear-gradient(135deg, var(--green), #2ab870);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    margin: 0 auto 20px;
    box-shadow: 0 8px 32px rgba(61,214,140,0.4);
  }
  .success-screen h2 { font-size: 26px; font-weight: 900; margin-bottom: 10px; }
  .success-screen p { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .order-id {
    display: inline-block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 22px;
    font-weight: 900;
    color: var(--accent);
    margin: 16px 0;
  }

  .hidden { display: none; }
</style>
</head>
<body>

<div id="main-screen">
  <div class="header">
    <div class="logo">🚗</div>
    <h1>Dastavka</h1>
    <p class="subtitle">Tez va ishonchli yetkazib berish</p>
  </div>

  <div class="steps">
    <div class="step-dot active" id="dot1"></div>
    <div class="step-dot" id="dot2"></div>
    <div class="step-dot" id="dot3"></div>
  </div>

  <!-- 1-qadam -->
  <div class="card" id="step1">
    <div class="card-title">📦 Buyurtma ma'lumotlari</div>
    <div class="field">
      <label>Ismingiz</label>
      <input type="text" id="client-name" placeholder="Ism va familiya">
    </div>
    <div class="field">
      <label>Telefon raqam</label>
      <input type="tel" id="client-phone" placeholder="+998 90 123 45 67">
    </div>
    <div class="field">
      <label>Buyurtma / Izoh</label>
      <textarea id="client-note" placeholder="Nima kerak, qo'shimcha ma'lumot..."></textarea>
    </div>
    <button class="submit-btn" onclick="goStep2()">Davom etish →</button>
  </div>

  <!-- 2-qadam -->
  <div class="card hidden" id="step2">
    <div class="card-title">📍 Manzil</div>
    <div class="field">
      <label>Aniq manzil</label>
      <input type="text" id="client-address" placeholder="Ko'cha, uy raqami, mo'ljal">
    </div>
    <button class="loc-btn" id="loc-btn" onclick="getLocation()">
      <span>📍</span> <span id="loc-text">Lokatsiyamni yuborish</span>
    </button>
    <div class="map-preview" id="map-preview">
      <span style="font-size:28px">🗺️</span>
      <span>Lokatsiya aniqlanmagan</span>
    </div>
    <div class="map-coords hidden" id="map-coords"></div>
    <button class="submit-btn" id="order-btn" onclick="sendOrder()" style="margin-top:16px" disabled>
      🚀 Buyurtma berish
    </button>
  </div>
</div>

<!-- Muvaffaqiyat -->
<div class="success-screen" id="success-screen">
  <div class="success-icon">✅</div>
  <h2>Buyurtma qabul qilindi!</h2>
  <div class="order-id" id="order-num">#0001</div>
  <p>Haydovchi tez orada yo'lga chiqadi.<br>Aloqa uchun kutib turing! 🚗</p>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  let lat = null, lon = null;
  let currentStep = 1;

  function goStep2() {
    const name = document.getElementById('client-name').value.trim();
    const phone = document.getElementById('client-phone').value.trim();
    if (!name) { alert('Ismingizni kiriting!'); return; }
    if (!phone) { alert('Telefon raqam kiriting!'); return; }
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
    document.getElementById('dot1').classList.remove('active');
    document.getElementById('dot2').classList.add('active');
  }

  function getLocation() {
    const btn = document.getElementById('loc-btn');
    const locText = document.getElementById('loc-text');
    locText.textContent = 'Aniqlanmoqda...';

    if (!navigator.geolocation) {
      alert('Brauzeringiz lokatsiyani qo\'llab-quvvatlamaydi');
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        lat = pos.coords.latitude;
        lon = pos.coords.longitude;
        locText.textContent = 'Lokatsiya aniqlandi ✓';
        btn.classList.add('success');

        const mapDiv = document.getElementById('map-preview');
        mapDiv.innerHTML = `<iframe src="https://maps.google.com/maps?q=${lat},${lon}&z=16&output=embed"></iframe>`;

        document.getElementById('map-coords').classList.remove('hidden');
        document.getElementById('map-coords').textContent = `📍 ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
        document.getElementById('order-btn').disabled = false;
        document.getElementById('dot2').classList.remove('active');
        document.getElementById('dot3').classList.add('active');
      },
      () => { locText.textContent = '📍 Lokatsiyamni yuborish'; alert('Lokatsiyaga ruxsat bering!'); }
    );
  }

  function sendOrder() {
    const name = document.getElementById('client-name').value.trim();
    const phone = document.getElementById('client-phone').value.trim();
    const address = document.getElementById('client-address').value.trim();
    const note = document.getElementById('client-note').value.trim();

    const data = { name, phone, address, note, lat, lon };

    if (tg) {
      tg.sendData(JSON.stringify(data));
    } else {
      console.log('Order:', data);
    }

    const orderNum = '#' + String(Math.floor(Math.random() * 9000) + 1000);
    document.getElementById('order-num').textContent = orderNum;
    document.getElementById('main-screen').style.display = 'none';
    document.getElementById('success-screen').style.display = 'block';
  }
</script>
</body>
</html>
